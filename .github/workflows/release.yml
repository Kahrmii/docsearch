name: release

# Pushing a tag like v0.9.0 runs the tests, builds the wheel and the source archive and publishes a GitHub release
# with both files. The notes are the matching section of CHANGELOG.md. Nothing is uploaded to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag matches the version in the code
        run: python -c "import sys, docsearch; sys.exit(0 if 'v' + docsearch.__version__ == '${{ github.ref_name }}' else 'Tag ${{ github.ref_name }} does not match version ' + docsearch.__version__)"
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: Build wheel and source archive
        run: |
          python -m pip install -q build
          python -m build --outdir dist .
      - name: Release notes from the changelog
        run: |
          python - <<'EOF'
          import re, docsearch
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## " + re.escape(docsearch.__version__) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          open("release_notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n" if match else "See CHANGELOG.md\n")
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file release_notes.md
